spring.application.name=monitoring-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monitoring_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

monitor.scheduler.delay-ms=${MONITOR_SCHEDULER_DELAY_MS:60000}
monitor.scheduler.lock-at-most-ms=${MONITOR_SCHEDULER_LOCK_AT_MOST_MS:300000}
monitor.status.stale-after-ms=${MONITOR_STATUS_STALE_AFTER_MS:120000}
monitor.security.allow-private-targets=${MONITOR_ALLOW_PRIVATE_TARGETS:false}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
